name: Flutter CI and Release Build

on:
  push:
    branches:
      - main

concurrency:
  group: flutter-production-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  build-release:
    name: build-release
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure release signing secrets exist
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}"

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release-keystore.jks

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF

      - name: Resolve production version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build release appbundle
        run: |
          flutter build appbundle \
            --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"

      - name: Upload release appbundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: wobbly-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wobbly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
